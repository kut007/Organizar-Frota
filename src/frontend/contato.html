<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">

    <link rel="stylesheet" href="css/style.css">
    <title>NaviFrota - Contato</title>
</head>
<body class="body-sobrenos">

<section class="banner-contato">
<h4 class="textinho-banner">CONTATO</h4>
<h1 class="textao-banner-sobre">Vamos colocar sua frota em ordem.</h1>
<h3>Conte um pouco sobre sua operação e retornamos em até um dia útil.</h3>
</section>

<section class="contato-info">
<p class="numero-servico">E-MAIL</p>
contato@navifrota.com
<br><br>
<p class="numero-servico">TELEFONE</p>
+55 (14) 4002-8922
<br><br>
<p class="numero-servico">ENDEREÇO</p>
Porto de Barcos, Marília SP
</section>

<section class="secao-contato">
<form class="formu">
    <input type="text" name="nome" id="nome" placeholder="Nome" class="nome">
    <p>
    <input type="text" name="email" id="email" placeholder="E-mail" class="nome">
    <p>
    <input type="text" name="empresa" id="empresa" placeholder="Empresa / tamanho da frota" class="nome">
    <p>
    <input type="text" name="mensagem" id="mensagem" placeholder="Mensagem" class="contato" ></p>
    
     <p>
    <button type="submit" class="enviar">Enviar Mensagem</button>
    </p>
    </form>
  </section>

</body>
